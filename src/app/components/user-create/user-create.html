      />

<div class="pt-16 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-xl">
    <div
      class="bg-primary-container rounded-2xl p-8 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border border-outline-variant/30"
    >
      <div class="mb-10 text-center">
        <h2 class="text-2xl font-bold text-white mb-2">Crear Usuario</h2>
        <p class="text-on-surface-variant text-sm">Añadir un nuevo usuario al sistema</p>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Nombre -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1"
            >Nombre</label
          >
          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre completo"
            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white"
          />
          <div
            *ngIf="userForm.get('nombre')?.invalid && userForm.get('nombre')?.touched"
            class="text-red-400 text-xs font-semibold pl-1"
          >
            El nombre es obligatorio.
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1"
            >Email</label
          >
          <input
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white"
          />
          <div
            *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched"
            class="text-red-400 text-xs font-semibold pl-1"
          >
            Debe ser un email válido.
          </div>
        </div>

        <!-- Contraseña -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1"
            >Contraseña</label
          >
          <input
            type="password"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white"
          />
          <div
            *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched"
            class="text-red-400 text-xs font-semibold pl-1"
          >
            La contraseña debe tener al menos 6 caracteres.
          </div>
        </div>

        <!-- Rol -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Rol</label>
          <select
            formControlName="rol"
            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white appearance-none"
          >
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <!-- Organización / Universidad -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1"
            >Organización / Universidad</label
          >
          <select
            formControlName="universidad"
            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white appearance-none"
          >
            <option value="" disabled selected>Seleccione una organización</option>
            <option *ngFor="let uni of universidades" [value]="uni._id">{{ uni.nombre }}</option>
          </select>
          <div
            *ngIf="userForm.get('universidad')?.invalid && userForm.get('universidad')?.touched"
            class="text-red-400 text-xs font-semibold pl-1"
          >
            La organización es obligatoria.
          </div>
        </div>

        <div class="pt-4">
          <button
            type="submit"
            [disabled]="userForm.invalid || isSubmitting"
            class="w-full bg-gradient-to-br from-secondary to-primary-container text-on-secondary-fixed py-3.5 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isSubmitting">Crear Usuario</span>
            <span *ngIf="isSubmitting">Creando...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
