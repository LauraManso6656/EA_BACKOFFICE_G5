    <div class="flex items-center gap-4">
        <button
            class="flex items-center gap-2 text-on-surface-variant hover:text-secondary transition-colors px-3 py-1.5 rounded-lg hover:bg-surface-container-highest/50"
            [routerLink]="['/usuarios']">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="text-sm font-bold">Volver</span>
        </button>
    </div>

    <div class="absolute left-1/2 -translate-x-1/2">
        <span class="text-xl font-bold tracking-tight text-white">AdminPanel</span>

    <div class="flex items-center gap-4">
        <div
            class="flex items-center gap-3 px-3 py-1.5 rounded-full bg-surface-container/50 backdrop-blur-sm shadow-sm border border-outline-variant/20">
            <span class="text-[11px] font-semibold tracking-wider uppercase text-secondary">Admin</span>
            <img alt="Admin profile avatar" class="w-8 h-8 rounded-full object-cover ring-1 ring-outline-variant/30"

        </div>
    </div>
</nav>

<div class="pt-16 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-xl">
        <div
            class="bg-primary-container rounded-2xl p-8 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border border-outline-variant/30">
            <div class="mb-10 text-center">
                <h2 class="text-2xl font-bold text-white mb-2">Detalles del Usuario</h2>
                <p class="text-on-surface-variant text-sm">Información detallada y gestión de permisos</p>
            </div>

            <form [formGroup]="userForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Nombre</label>
                    <input type="text" formControlName="nombre"
                        class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white disabled:opacity-60 disabled:cursor-not-allowed">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Email</label>
                    <input type="email" formControlName="email"
                        class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white disabled:opacity-60 disabled:cursor-not-allowed">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Rol</label>
                    <select formControlName="rol"
                        class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white disabled:opacity-60 disabled:cursor-not-allowed appearance-none">
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Universidad</label>
                    <div class="relative">
                        <input type="text" [formControl]="universidadSearch" (focus)="showUniversidadesDropdown = true"
                            placeholder="Buscar universidad..."
                            class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white disabled:opacity-60 disabled:cursor-not-allowed">

                        <div *ngIf="showUniversidadesDropdown && filteredUniversidades.length > 0 && isEditing"
                            class="absolute z-[60] w-full mt-2 bg-surface-container-highest border border-primary/20 rounded-xl shadow-2xl max-h-48 overflow-y-auto backdrop-blur-xl">
                            <div *ngFor="let uni of filteredUniversidades" (mousedown)="selectUniversidad(uni)"
                                class="px-4 py-3 hover:bg-secondary/20 cursor-pointer text-sm text-white border-b border-outline-variant/10 last:border-none transition-colors">
                                {{ uni.nombre }}
                            </div>
                        </div>

                        <!-- Overlay to close dropdown when clicking outside (alternative to blur) -->
                        <div *ngIf="showUniversidadesDropdown" (click)="showUniversidadesDropdown = false"
                            class="fixed inset-0 z-[55]"></div>
                    </div>
                    <!-- Hidden actual control for Reactive Forms -->
                    <input type="hidden" formControlName="universidad">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Nueva
                        Contraseña</label>
                    <input type="password" formControlName="password" placeholder="Dejar vacío para no cambiar"
                        class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white disabled:opacity-60 disabled:cursor-not-allowed">
                </div>

                <div class="pt-4">
                    <button *ngIf="!isEditing" type="button" (click)="toggleEdit()"
                        class="w-full bg-gradient-to-br from-secondary to-primary-container text-on-secondary-fixed py-3.5 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm font-bold">edit</span>
                        Editar Usuario
                    </button>

                    <div *ngIf="isEditing" class="flex gap-4">
                        <button type="button" (click)="cancelEdit()"
                            class="flex-1 bg-surface-container-highest text-white py-3.5 rounded-xl text-sm font-bold hover:bg-surface-container/80 transition-colors border border-outline-variant/20">
                            Cancelar
                        </button>
                        <button type="submit" (click)="saveChanges()" [disabled]="userForm.invalid"
                            class="flex-[2] bg-gradient-to-br from-secondary to-primary-container text-on-secondary-fixed py-3.5 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition-all disabled:opacity-50">
                            Guardar Cambios
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
